namespace: capi-webhook-system

labels:
- pairs:
    cluster.x-k8s.io/provider: "infrastructure-oci"

namePrefix: capoci-

resources:
  - ../../config/crd
  - ../../config/manager
  - ../../config/webhook
  - ../../config/certmanager

vars:
- name: CERTIFICATE_NAMESPACE
  objref:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
  fieldref:
    fieldpath: metadata.namespace
- name: CERTIFICATE_NAME
  objref:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
  fieldref:
    fieldpath: metadata.name
- name: SERVICE_NAMESPACE
  objref:
    kind: Service
    version: v1
    name: webhook-service
  fieldref:
    fieldpath: metadata.namespace
- name: SERVICE_NAME
  objref:
    kind: Service
    version: v1
    name: webhook-service

configurations:
  - kustomizeconfig.yaml

patches:
- path: manager_webhook_patch.yaml
- path: webhook_ca_injection_patch.yaml
- path: certificate_secretname_patch.yaml
- target:
    kind: Deployment
    name: controller-manager
  patch: |-
    - op: remove
      path: /spec/template/spec/serviceAccountName
- target:
    kind: Namespace
    name: system
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: system
